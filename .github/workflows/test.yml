name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/sdk/openai-node/package-lock.json
      - run: npm --prefix tests/sdk/openai-node ci
      - run: go generate ./...
      - run: git diff --exit-code
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.42.0
      - run: modernize ./...
      - run: go test -tags=integration ./tests/integration/openai
      - run: go test -race -tags=integration ./tests/integration/openai

  downstream-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/sdk/openai-node/package-lock.json
      - run: npm --prefix tests/sdk/openai-node ci
      - name: Test the frozen profile with the downstream validator
        shell: bash
        run: |
          modfile="$RUNNER_TEMP/downstream.mod"
          cp go.mod "$modfile"
          cp go.sum "$RUNNER_TEMP/downstream.sum"
          go mod edit -modfile="$modfile" -go=1.25.0 -require=github.com/getkin/kin-openapi@v0.152.0
          go mod tidy -modfile="$modfile"
          go test -modfile="$modfile" -race ./...
          go vet -modfile="$modfile" ./...
          go test -modfile="$modfile" -race -tags=integration ./tests/integration/openai
